<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div class="login-screen active" id="loginScreen">
  <div class="orb o1"></div><div class="orb o2"></div>
  <div class="login-card glass">
    <div class="login-brand">
      <div class="dock-brand" style="margin:0;">TF</div>
      <span style="font-weight:800;font-size:18px;">TaskFlow</span>
    </div>
    <div class="login-title">ورود به حساب</div>
    <div class="login-sub">پروژه‌ها و تسک‌های تیم‌تان را در یک جا مدیریت کنید</div>
    <form id="loginForm" novalidate>
      <div class="form-group" id="emailGroup">
        <label class="form-label" for="emailInput">ایمیل</label>
        <input class="form-input" id="emailInput" type="email" placeholder="name@company.com" autocomplete="email">
        <div class="form-error" id="emailError">ایمیل را به‌درستی وارد کنید</div>
      </div>
      <div class="form-group" id="passGroup">
        <label class="form-label" for="passInput">رمز عبور</label>
        <input class="form-input" id="passInput" type="password" placeholder="••••••••" autocomplete="current-password">
        <div class="form-error" id="passError">رمز عبور را وارد کنید</div>
      </div>
      <button class="btn login-btn" type="submit">ورود</button>
    </form>
    <div class="login-foot">دسترسی ندارید؟ از مدیر تیم دعوت‌نامه بخواهید</div>
  </div>
</div>

<!-- ============ APP ============ -->
<div class="app" id="app">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="overlay" id="sidebarOverlay"></div>
  <div class="shell">
    <nav class="dock glass" id="mainNav">
      <div class="dock-brand">TF</div>
      <button class="dock-item" data-view="dashboard" title="داشبورد">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      </button>
      <button class="dock-item" data-view="projects" title="پروژه‌ها">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
      </button>
      <button class="dock-item" data-view="kanban" title="تسک‌ها">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/></svg>
      </button>
      <button class="dock-item" data-view="team" title="تیم">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.8-3.6 3.4-5.6 6.5-5.6s5.7 2 6.5 5.6"/><circle cx="17.5" cy="8.5" r="2.4"/><path d="M15.8 14.6c2.6.2 4.6 2.1 5.2 4.9"/></svg>
      </button>
      <button class="dock-item" data-view="notifications" title="اعلان‌ها">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 12 6 8Z"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0"/></svg>
      </button>
      <div class="dock-spacer"></div>
      <button class="dock-item" data-view="profile" title="پروفایل">
        <div class="avatar sm">س.ر</div>
      </button>
    </nav>

    <div class="main-col">
      <div class="topbar glass">
        <button class="pill-icon-btn menu-btn" onclick="openSidebar()" aria-label="منو">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="breadcrumb">TaskFlow <span class="breadcrumb-sep">/</span> <b id="breadcrumbCurrent">داشبورد</b></div>
        <div class="search-box" id="searchBox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="globalSearch" placeholder="جستجو در تسک‌ها، پروژه‌ها و اعضا..." autocomplete="off" oninput="runSearch(this.value)" onfocus="runSearch(this.value)">
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="topbar-actions">
          <button class="pill-icon-btn" onclick="go('notifications')" aria-label="اعلان‌ها">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 1.5 5.5h-15S6 12 6 8Z"/><path d="M9.5 17a2.5 2.5 0 0 0 5 0"/></svg>
            <span class="dot-badge"></span>
          </button>
          <button class="btn secondary" id="newTaskBtn" onclick="openNewTask()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            تسک جدید
          </button>
          <div class="topbar-avatar">س.ر</div>
        </div>
      </div>

      <div class="page-head">
        <div>
          <div class="page-title" id="pageTitle">داشبورد</div>
          <div class="page-sub" id="pageSub">وضعیت کلی پروژه‌ها و تسک‌های تیم</div>
        </div>
      </div>

      <div id="viewport"></div>
    </div>
  </div>
</div>

<!-- ============ TASK DRAWER ============ -->
<div class="overlay" id="drawerOverlay" onclick="closeDrawer(event)">
  <div class="drawer" onclick="event.stopPropagation()">
    <div class="drawer-head">
      <strong style="font-size:12.5px;color:var(--muted);">جزئیات تسک</strong>
      <button class="pill-icon-btn" onclick="closeDrawer()" aria-label="بستن">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</div>

<script src="src/app.js"></script>
</body>
</html>
